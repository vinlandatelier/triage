name: ai-review

# Same-repo PRs only: the job runs with the app's token.
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A dispatch carries no PR payload, so the same-repo check above cannot see a fork PR.
      # Its code would run with the secrets below.
      - if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          fork=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          [ "$fork" = false ] || { echo "PR #$PR comes from a fork; not reviewing it." >&2; exit 1; }

      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.ASSISTANT_APP_ID }}
          private-key: ${{ secrets.ASSISTANT_APP_PRIVATE_KEY }}

      # Only PRs by people with write access get reviewed. author_association would read
      # CONTRIBUTOR for members whose org membership is private.
      - name: author has write access
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          who=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json author --jq .author.login)
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$who/permission" --jq .permission || echo none)
          [[ "$perm" =~ ^(admin|maintain|write)$ ]] || { echo "PR #$PR author $who has $perm access; skipping." >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr) }}
          fetch-depth: 0

      # Scope from refs/ai-reviewed/<pr>, the head of the last finished review. A review that
      # finds nothing posts nothing, so the bot's review list alone would lag behind. A commit
      # counts as new only if its patch is not already in what was reviewed. A squash changes
      # every folded slice's patch, so the whole-branch diff is compared first: unchanged means
      # a pure squash or rebase, and nothing to review.
      - id: scope
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          full() { echo "mode=full" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$ACTION" = synchronize ] || full
          if git fetch -q origin "+refs/ai-reviewed/$PR:refs/ai-reviewed/$PR" 2>/dev/null; then
            last=refs/ai-reviewed/$PR
          else
            # PRs reviewed before the ref existed: fall back to the bot's last posted review.
            last=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
              --jq '.[] | select(.user.login == "vinland-ai[bot]") | .commit_id' | tail -n 1)
            [ -n "$last" ] || full
            git fetch -q origin "$last" || full
          fi
          whole() { git diff "origin/$BASE...$1" | git patch-id --stable | cut -d' ' -f1; }
          [ "$(whole "$last")" != "$(whole HEAD)" ] || { echo "mode=skip" >> "$GITHUB_OUTPUT"; exit 0; }
          ids() { git log -p --format='commit %H' "$1" | git patch-id --stable; }
          new=$(awk 'NR == FNR { seen[$1] = 1; next } !seen[$1] { print $2 }' \
            <(ids "origin/master..$last") <(ids "origin/$BASE..HEAD") | tr '\n' ' ')
          if [ -z "$new" ]; then echo "mode=skip" >> "$GITHUB_OUTPUT"
          else { echo "mode=incremental"; echo "commits=$new"; } >> "$GITHUB_OUTPUT"; fi

      - if: steps.scope.outputs.mode != 'skip'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          # The assistant's own pushes (review fixes) need review too.
          allowed_bots: vinland-ai
          prompt: |
            Review PR #${{ github.event.pull_request.number || inputs.pr }} with the pr-review skill in .claude/skills/pr-review/SKILL.md.
            Mode: ${{ steps.scope.outputs.mode }}.${{ steps.scope.outputs.mode == 'incremental' && format(' Review only these new commits (git show each): {0}', steps.scope.outputs.commits) || '' }}
            Do not edit files or push.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 80
            --allowedTools "Bash,Read,Glob,Grep,Task"
            --disallowedTools "Edit,Write,Bash(git push:*),Bash(gh pr merge:*),Bash(gh api *merge*)"

      # Runs only when the review finished, so a cancelled run leaves its commits in scope.
      - name: record the reviewed head
        env:
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: git push -q --force origin "HEAD:refs/ai-reviewed/$PR"
