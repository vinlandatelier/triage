name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  # Only PRs cancel: every master commit needs its own CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # build.rs embeds web/dist, so web changes rebuild the crate; openapi.json feeds gen-api.
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - '.cargo/**'
              - 'justfile'
              - 'scripts/**'
              - 'web/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'tools/**'
              - 'crates/triage/openapi.json'
              - 'package.json'
              - 'bun.lock'
              - '.bun-version'
              - 'justfile'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/**'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,cargo-machete,cargo-nextest,sqlx-cli
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # build.rs needs web/dist to exist.
      - run: just build-web
      - run: just fmt-check
      - run: just clippy
      - run: just deny
      - run: just machete
      - run: just check-layout
      - run: just db-prepare-check
      - run: just db-schema-check
      - run: just openapi-check
      - run: just test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # vitest runs under node, not bun; match the Node 24 that `just setup` installs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: just check-web
      - run: just gen-api-check
      - run: just build-web

  e2e:
    needs: [rust, web]
    # A skipped need would skip this job too; web is often skipped on a Rust-only change.
    if: ${{ !cancelled() && needs.rust.result == 'success' && needs.web.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: just e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/

  # The builtin prek file checks, for pushes made without local hooks (the assistant's).
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: curl --proto =https --tlsv1.2 -LsSf https://github.com/j178/prek/releases/latest/download/prek-installer.sh | sh -s -- --no-modify-path
      - run: ~/.local/bin/prek run --all-files check-added-large-files check-case-conflict check-json check-merge-conflict check-toml check-yaml end-of-file-fixer mixed-line-ending trailing-whitespace

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Matches the actionlint rev in prek.toml.
      - run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

  # The one required check. Skipped jobs pass; a failed or cancelled one fails it.
  gate:
    needs: [changes, rust, web, e2e, files, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
