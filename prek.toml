default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]
# prek also loads api/prek.toml and web/prek.toml as workspace projects; their hooks run from their own dir.

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  # Vendored skills keep upstream whitespace so `just skills-update` patches apply.
  { id = "end-of-file-fixer", exclude = '^\.claude/skills/' },
  { id = "mixed-line-ending", exclude = '^\.claude/skills/' },
  { id = "trailing-whitespace", exclude = '^\.claude/skills/' },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
# just setup installs actionlint; the golang hook would compile it again.
hooks = [{ id = "actionlint-system" }]

[[repos]]
repo = "local"
hooks = [
  { id = "commitlint", name = "commitlint", language = "node", language_version = "24", entry = "commitlint --extends @commitlint/config-conventional --edit", stages = ["commit-msg"], additional_dependencies = ["@commitlint/cli@21.2.3", "@commitlint/config-conventional@21.2.3"] },
  { id = "api-client-drift", name = "api client drift", language = "system", entry = "just gen-api-check", files = '^(crates/triage/openapi\.json|tools/gen-api/|web/src/api/)', pass_filenames = false },
  { id = "db-schema-check", name = "schema.sql drift", language = "system", entry = "just db-schema-check", files = '^(api/migrations/|api/schema\.sql$|api/src/store/|scripts/db-schema\.sh$)', pass_filenames = false },
  { id = "check-layout", name = "layout check", language = "system", entry = "just check-layout", files = '^(api/src/|scripts/check-layout\.sh$)', pass_filenames = false },
]
