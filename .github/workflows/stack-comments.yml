name: stack comments

# Any open, close, merge, retarget, or restack can change several stacks at once, so every run
# rewrites the stack comment on every open PR. Unchanged comments are left alone.
on:
  pull_request_target:
    types: [opened, reopened, closed, edited, synchronize]
  workflow_dispatch:

concurrency:
  group: stack-comments
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.ASSISTANT_APP_ID }}
          private-key: ${{ secrets.ASSISTANT_APP_PRIVATE_KEY }}

      # pull_request_target checks out the PR's base by default; a stacked PR's base is
      # another PR branch, so pin the trusted copy on master.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - run: python3 scripts/stack-comments.py "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
