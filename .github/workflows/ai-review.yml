name: ai-review

# pull_request_target so the workflow comes from master and runs for PRs at any
# depth of a stack, whose bases never contain it. Same-repo PRs only.
on:
  pull_request_target:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'request-ai-review') &&
       (github.event.action == 'synchronize' || github.event.label.name == 'request-ai-review'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.ASSISTANT_APP_ID }}
          private-key: ${{ secrets.ASSISTANT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr) }}
          fetch-depth: 0

      # Scope from the commit the assistant last reviewed, not event.before: a cancelled run
      # never posts, so its commits stay in scope for the next one. A commit counts as new only
      # if its patch is not already in what was reviewed; restacked and rebased-in lower-PR
      # commits drop out, and a pure restack leaves nothing to review.
      - id: scope
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          full() { echo "mode=full" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$ACTION" = synchronize ] || full
          last=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" \
            --jq '[.[] | select(.user.login == "abyan-cc[bot]")] | last | .commit_id // empty')
          [ -n "$last" ] || full
          git fetch -q origin "$last" || full
          ids() { git log -p --format='commit %H' "$1" | git patch-id --stable; }
          new=$(awk 'NR == FNR { seen[$1] = 1; next } !seen[$1] { print $2 }' \
            <(ids "origin/master..$last") <(ids "origin/$BASE..HEAD") | tr '\n' ' ')
          if [ -z "$new" ]; then echo "mode=skip" >> "$GITHUB_OUTPUT"
          else { echo "mode=incremental"; echo "commits=$new"; } >> "$GITHUB_OUTPUT"; fi

      - if: steps.scope.outputs.mode != 'skip'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            Review PR #${{ github.event.pull_request.number || inputs.pr }} with the pr-review skill in .claude/skills/pr-review/SKILL.md.
            Mode: ${{ steps.scope.outputs.mode }}.${{ steps.scope.outputs.mode == 'incremental' && format(' Review only these new commits (git show each): {0}', steps.scope.outputs.commits) || '' }}
            Do not edit files or push.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 80
            --allowedTools "Bash,Read,Glob,Grep,Task"
            --disallowedTools "Edit,Write,Bash(git push:*),Bash(gh pr merge:*),Bash(gh stack:*)"
            --append-system-prompt "The maintainer is @${{ vars.MAINTAINER }}."
