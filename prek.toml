default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
# just setup installs actionlint; the golang hook would compile it again.
hooks = [{ id = "actionlint-system" }]

[[repos]]
repo = "local"
hooks = [
  { id = "commitlint", name = "commitlint", language = "node", entry = "commitlint --extends @commitlint/config-conventional --edit", stages = ["commit-msg"], additional_dependencies = ["@commitlint/cli@21.2.3", "@commitlint/config-conventional@21.2.3"] },
  { id = "cargo-fmt", name = "cargo fmt", language = "system", entry = "just fmt-check", files = '\.rs$', pass_filenames = false },
  { id = "cargo-clippy", name = "cargo clippy", language = "system", entry = "just clippy", files = '\.rs$', pass_filenames = false },
]
