name: assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  respond:
    if: >-
      contains(github.event.comment.body, '@abyan-cc') ||
      contains(github.event.review.body, '@abyan-cc')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.ASSISTANT_APP_ID }}
          private-key: ${{ secrets.ASSISTANT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - run: gh extension install github/gh-stack
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          trigger_phrase: "@abyan-cc"
          claude_args: >-
            --model claude-opus-5-5 --max-turns 60
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep"
            --disallowedTools "Bash(gh pr merge:*),Bash(git push --force *),Bash(git push -f *)"
            --append-system-prompt "The maintainer is @${{ vars.MAINTAINER }}."
