name: ci

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  # Only PRs cancel: every master commit needs its own CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # web typechecks against the api's route types, so api changes run it too.
          filters: |
            api:
              - 'api/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '.bun-version'
              - 'justfile'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'api/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '.bun-version'
              - 'justfile'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # tsc, knip, and the licence checker are node scripts; match the Node 24 that `just setup` installs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: just check-api
      - run: just deny
      - run: just check-layout
      - run: just db-schema-check

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # vitest runs under node, not bun; match the Node 24 that `just setup` installs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: just check-web
      - run: just build-web

  # The builtin prek file checks, for pushes made without local hooks (the assistant's).
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: curl --proto =https --tlsv1.2 -LsSf https://github.com/j178/prek/releases/latest/download/prek-installer.sh | sh -s -- --no-modify-path
      - run: ~/.local/bin/prek run --all-files check-added-large-files check-case-conflict check-json check-merge-conflict check-toml check-yaml end-of-file-fixer mixed-line-ending trailing-whitespace

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Matches the actionlint rev in prek.toml.
      - run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

  # The one required check. Skipped jobs pass; a failed or cancelled one fails it.
  gate:
    needs: [changes, api, web, files, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
