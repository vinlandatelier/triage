[package]
name = "triage"
description = "Local life-admin agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "triage"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
directories = "6.0.0"
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
problem_details = { version = "0.11", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "registry", "std"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.28.0", default-features = false, features = ["std", "v7"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["env", "test"] }
insta = "1.49.0"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["parsing"] }
tokio = { version = "1.53.3", features = ["io-util"] }

[lints]
workspace = true
