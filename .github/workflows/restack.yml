name: restack

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# Merges in quick succession queue instead of racing on the same stack.
concurrency:
  group: restack
  cancel-in-progress: false

jobs:
  restack:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.ASSISTANT_APP_ID }}
          private-key: ${{ secrets.ASSISTANT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      # Skip the model session when no open PR is missing its base's latest commits.
      - id: stale
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          n=0
          while read -r head base; do
            git merge-base --is-ancestor "origin/$base" "origin/$head" 2>/dev/null || n=$((n + 1))
          done < <(gh pr list --state open --limit 200 --json headRefName,baseRefName --jq '.[] | "\(.headRefName) \(.baseRefName)"')
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - if: steps.stale.outputs.count != '0'
        run: gh extension install github/gh-stack --pin v0.2.1
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - if: steps.stale.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            PR #${{ github.event.pull_request.number }} (branch `${{ github.event.pull_request.head.ref }}`) was just squash-merged into master.
            Find every open PR whose base is `${{ github.event.pull_request.head.ref }}` or that GitHub retargeted to master because of this merge.
            If there are none, end. Otherwise restack each one's stack following the Restacking section of CLAUDE.md.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 60
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep"
            --disallowedTools "Bash(gh pr merge:*),Bash(git push --force *),Bash(git push -f *),Bash(git rebase:*),Bash(git push --force-with-lease*)"
            --append-system-prompt "The maintainer is @${{ vars.MAINTAINER }}."
