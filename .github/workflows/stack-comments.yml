name: stack comments

# Any open, close, merge, or retarget can change several stacks at once, so every run
# rewrites the stack comment on every open PR. Unchanged comments are left alone. Pushes,
# restacks included, never change which PR sits on which, so they do not trigger it.
on:
  pull_request_target:
    types: [opened, reopened, closed, edited]
  workflow_dispatch:

concurrency:
  group: stack-comments
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.ASSISTANT_APP_ID }}
          private-key: ${{ secrets.ASSISTANT_APP_PRIVATE_KEY }}

      # pull_request_target checks out the PR's base by default; a stacked PR's base is
      # another PR branch, so pin the trusted copy on master.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - run: python3 scripts/stack-comments.py "$GITHUB_REPOSITORY" "$CLOSED"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOSED: ${{ github.event.action == 'closed' && github.event.pull_request.number || '' }}
