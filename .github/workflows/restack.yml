name: restack

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# Merges in quick succession queue instead of racing on the same stack. The queue keeps one
# pending run and cancels older ones, so each run restacks every stale stack, not just its own.
concurrency:
  group: restack
  cancel-in-progress: false

jobs:
  restack:
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.ASSISTANT_APP_ID }}
          private-key: ${{ secrets.ASSISTANT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      # A PR is stale when it sits on another PR's branch and lacks that branch's tip, or when it
      # still carries the merged PR's commits. A PR on master that is merely behind is not stale:
      # squash merges never need it rebased.
      - id: stale
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MERGED: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q origin "$MERGED" || true
          prs=""
          while read -r n head base; do
            if [ "$base" = master ]; then
              git merge-base --is-ancestor "$MERGED" "origin/$head" 2>/dev/null || continue
            else
              git merge-base --is-ancestor "origin/$base" "origin/$head" 2>/dev/null && continue
            fi
            prs="$prs #$n"
          done < <(gh pr list --state open --limit 500 --json number,headRefName,baseRefName --jq '.[] | "\(.number) \(.headRefName) \(.baseRefName)"')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

      - if: steps.stale.outputs.prs != ''
        run: gh extension install github/gh-stack --pin v0.2.1
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - if: steps.stale.outputs.prs != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            PR #${{ github.event.pull_request.number }} was just squash-merged into master.
            These open PRs are stale:${{ steps.stale.outputs.prs }}. Restack every stack that contains one, following the Restacking section of CLAUDE.md.
            Include stacks unrelated to this merge: a run cancelled by the queue leaves its stacks for this one.
          claude_args: >-
            --model claude-opus-5-5 --max-turns 60
            --allowedTools "Bash,Edit,Write,Read,Glob,Grep"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh stack merge:*),Bash(git push --force *),Bash(git push -f *),Bash(git rebase:*),Bash(git push --force-with-lease*),Bash(git push * --force*),Bash(git push * -f*),Bash(git push *+*),Bash(gh api *merge*),Bash(git merge:*),Bash(git pull:*)"
            --append-system-prompt "The maintainer is @${{ vars.MAINTAINER || github.repository_owner }}."
