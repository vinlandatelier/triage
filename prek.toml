default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]
# prek also loads web/prek.toml as a workspace project; its hooks run from web/.

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  # Vendored skills keep upstream whitespace so `just skills-update` patches apply.
  { id = "end-of-file-fixer", exclude = '^\.claude/skills/' },
  { id = "mixed-line-ending", exclude = '^\.claude/skills/' },
  { id = "trailing-whitespace", exclude = '^\.claude/skills/' },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
# just setup installs actionlint; the golang hook would compile it again.
hooks = [{ id = "actionlint-system" }]

[[repos]]
repo = "local"
hooks = [
  { id = "commitlint", name = "commitlint", language = "node", language_version = "24", entry = "commitlint --extends @commitlint/config-conventional --edit", stages = ["commit-msg"], additional_dependencies = ["@commitlint/cli@21.2.3", "@commitlint/config-conventional@21.2.3"] },
  { id = "cargo-fmt", name = "cargo fmt", language = "system", entry = "just fmt-check", files = '(\.rs$|^Cargo\.(toml|lock)$|/Cargo\.toml$|^(rustfmt|rust-toolchain)\.toml$)', pass_filenames = false },
  { id = "schema-drift", name = "schema drift", language = "system", entry = "just db-schema-check", files = '^crates/triage/(migrations/|schema\.sql$)', pass_filenames = false },
  { id = "openapi-drift", name = "openapi drift", language = "system", entry = "just openapi-check", files = '^(Cargo\.(toml|lock)$|crates/triage/(Cargo\.toml$|src/|openapi\.json$))', pass_filenames = false },
  { id = "api-client-drift", name = "api client drift", language = "system", entry = "just gen-api-check", files = '^(crates/triage/openapi\.json|tools/gen-api/|web/src/api/)', pass_filenames = false },
  { id = "check-layout", name = "layout check", language = "system", entry = "just check-layout", files = '^crates/triage/src/', pass_filenames = false },
  { id = "cargo-clippy", name = "cargo clippy", language = "system", entry = "just clippy", files = '(\.rs$|^Cargo\.(toml|lock)$|/Cargo\.toml$|^(rustfmt|rust-toolchain)\.toml$)', pass_filenames = false },
]
