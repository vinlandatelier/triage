[package]
name = "triage"
description = "Local life-admin agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "triage"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
directories = "6.0.0"
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "registry", "std"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
figment = { version = "0.10.19", features = ["env", "test"] }
insta = "1.49.0"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["parsing"] }

[lints]
workspace = true
